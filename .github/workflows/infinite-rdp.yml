name: INFINITE-RDP

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  windows-latest-rdp:
    runs-on: windows-2022
    timeout-minutes: 360 
    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=Ahmed-Hacker-Immortal --accept-routes
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 10
              $retries++
          }
          if (-not $tsIP) {
              Write-Warning "Tailscale IP not assigned."
          } else {
              echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          }

      - name: Setup HuggingFace CLI & Restore Files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          # تثبيت أدوات HuggingFace
          pip install huggingface_hub -q
          huggingface-cli login --token $env:HF_TOKEN

          $desktopPath = "C:\Users\RDP\Desktop"
          $downloadsPath = "C:\Users\RDP\Downloads"
          $cloudRepo = "C:\HF_Cloud"
          
          if (-not (Test-Path $desktopPath)) { New-Item -ItemType Directory -Path $desktopPath -Force }
          if (-not (Test-Path $downloadsPath)) { New-Item -ItemType Directory -Path $downloadsPath -Force }

          Write-Host "Downloading saved files from HuggingFace..."
          # استنساخ الـ Repo اللي فيه الملفات
          if (-not (Test-Path $cloudRepo)) {
              git clone "https://huggingface.co/datasets/$env:HF_REPO" $cloudRepo 2>$null
          }
          
          if (Test-Path "$cloudRepo\Desktop") {
              Copy-Item -Path "$cloudRepo\Desktop\*" -Destination $desktopPath -Recurse -Force
              Write-Host "Desktop files restored!"
          }
          if (Test-Path "$cloudRepo\Downloads") {
              Copy-Item -Path "$cloudRepo\Downloads\*" -Destination $downloadsPath -Recurse -Force
              Write-Host "Downloads files restored!"
          }

      - name: Display RDP Credentials
        run: |
          Write-Host "=== WINDOWS LATEST RDP (IMMORTAL ZERO-DOWNTIME) ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "================================================="

      - name: Maintain RDP, Auto-Sync & Respawn (3 MINS TEST)
        if: always()
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ secrets.HF_REPO }}
        run: |
          $RunTime = 3 # 3 دقايق للتجربة
          $StartTime = Get-Date
          $cloudRepo = "C:\HF_Cloud"
          
          # Anti-Idle + Auto Cloud Sync (كل 30 ثانية للتجربة)
          # استخدام python script صغيرة عشان نتفادى مشاكل الـ PowerShell Variables
          $syncScript = @"
          import os, shutil, subprocess
          from huggingface_hub import Repository
          
          repo_path = r"C:\HF_Cloud"
          repo_url = f"https://huggingface.co/datasets/{os.environ['HF_REPO']}"
          token = os.environ['HF_TOKEN']
          
          if not os.path.exists(repo_path):
              repo = Repository(local_dir=repo_path, clone_from=repo_url, token=token)
          else:
              repo = Repository(local_dir=repo_path)
              repo.git_pull()
              
          os.makedirs(os.path.join(repo_path, "Desktop"), exist_ok=True)
          os.makedirs(os.path.join(repo_path, "Downloads"), exist_ok=True)

          # نسخ الملفات من الـ RDP للـ Cloud Repo
          for f in os.listdir(r"C:\Users\RDP\Desktop"):
              src = os.path.join(r"C:\Users\RDP\Desktop", f)
              dst = os.path.join(repo_path, "Desktop", f)
              if os.path.isfile(src): shutil.copy2(src, dst)
              
          for f in os.listdir(r"C:\Users\RDP\Downloads"):
              src = os.path.join(r"C:\Users\RDP\Downloads", f)
              dst = os.path.join(repo_path, "Downloads", f)
              if os.path.isfile(src): shutil.copy2(src, dst)

          repo.git_add()
          repo.git_commit("Auto Sync from RDP")
          repo.git_push()
          "@
          $syncScript | Out-File -FilePath "C:\sync_hf.py" -Encoding UTF8

          Start-Process -FilePath "python" -ArgumentList "C:\sync_hf.py" -WindowStyle Hidden

          while ($true) {
              $Elapsed = (Get-Date) - $StartTime
              if ($Elapsed.TotalMinutes -ge $RunTime) { 
                  Write-Host "[RESPAWN] 3 Minutes Reached! Doing final Cloud Upload before respawn..."
                  
                  # Final Sync
                  try {
                      python C:\sync_hf.py 2>&1 | Write-Host
                      Write-Host "Final Sync Complete!"
                  } catch {
                      Write-Host "Final Sync Failed, but proceeding to Respawn..."
                  }
                  
                  Write-Host "[RESPAWN] Triggering Zero-Downtime Respawn..."
                  $repo = $env:GITHUB_REPOSITORY
                  $wfFile = "infinite-rdp.yml"
                  $apiUrl = "https://api.github.com/repos/$repo/actions/workflows/$($wfFile)/dispatches"
                  
                  $body = @{ ref = "main" } | ConvertTo-Json

                  try {
                      Invoke-RestMethod -Uri $apiUrl -Method Post -Headers @{
                        "Authorization" = "Bearer $env:PAT_TOKEN"
                        "Accept" = "application/vnd.github.v3+json"
                      } -Body $body -ContentType "application/json"
                      Write-Host "[RESPAWN] SUCCESS! New Workflow triggered. Your files are immortalized in HuggingFace!"
                  } catch {
                      Write-Error "[RESPAWN] FAILED to trigger workflow. Error: $_"
                  }
                  
                  break 
              }
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] WinLatest RDP Active (Immortal). Elapsed: $([math]::Round($Elapsed.TotalMinutes, 1)) mins"
              Start-Sleep -Seconds 10
          }
