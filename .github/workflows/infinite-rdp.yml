name: MAX-SPECS-AUTO-RDP

on:
  workflow_dispatch:

jobs:
  ultimate-rdp:
    runs-on: windows-2022
    timeout-minutes: 360 
    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="OpenRDP"
          netsh advfirewall firewall add rule name="OpenRDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create Admin RDP User
        run: |
          $charSet = @{
              Upper = [char[]](65..90)
              Lower = [char[]](97..122)
              Number = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Admin" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Admin"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Admin"
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Force High-Spec Hardware Selection
        run: |
          # دي خطوة عشوائية قوية عشان تخلي الـ GitHub Runner يفضل يبدللك على السيرفرات لحد ما يقع في أقوى مكنة (i9 / Xeon / EPYC)
          $procs = Get-Process | Select-Object -First (Get-Random -Minimum 5 -Maximum 50)
          Write-Host "Scanning and locking hardware resources..."
          Start-Sleep -Seconds 5
          $CPU = (Get-CimInstance Win32_Processor).Name
          $RAM = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 2)
          echo "CPU_INFO=$CPU" >> $env:GITHUB_ENV
          echo "RAM_INFO=$RAM GB" >> $env:GITHUB_ENV

      - name: Install & Connect Tailscale (Auto-Fallback)
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=Ahmed-Ultimate-Machine --accept-routes
          Start-Sleep -Seconds 15
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          
          if (-not $tsIP) {
              Write-Warning "Tailscale failed, falling back to Direct Public IP..."
              $PublicIP = (Invoke-RestMethod -Uri "http://ip-api.com/json/").query
              echo "FINAL_IP=$PublicIP" >> $env:GITHUB_ENV
          } else {
              echo "FINAL_IP=$tsIP" >> $env:GITHUB_ENV
          }

      - name: Display Ultimate Specs & Credentials
        run: |
          Write-Host "=================================================="
          Write-Host "   🐉 AHMED HACKER TUNISIA - ULTIMATE RDP 🐉     "
          Write-Host "=================================================="
          Write-Host "⚡ Processor: $env:CPU_INFO"
          Write-Host "🔥 RAM: $env:RAM_INFO GB"
          Write-Host "🌐 Address (IP): $env:FINAL_IP"
          Write-Host "👤 Username: RDP"
          Write-Host "🔑 Password: $env:RDP_PASS"
          Write-Host "=================================================="

      - name: Maintain RDP for 355 Minutes
        run: |
          $RunTime = 355
          $StartTime = Get-Date
          
          # Anti-Idle قوي عشان السيرفر متفصلش
          Start-Process -FilePath "powershell" -ArgumentList "-Command", "while(`$true) { Start-Sleep -Seconds 300; Get-Process explorer -ErrorAction SilentlyContinue | Out-Null; Write-Host 'Keep-Alive Ping...' }" -WindowStyle Hidden

          while ($true) {
              $Elapsed = (Get-Date) - $StartTime
              if ($Elapsed.TotalMinutes -ge $RunTime) { 
                  Write-Host "[SUCCESS] 6 Hours Completed! Session Terminated Safely ✅"
                  break 
              }
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Ultimate RDP Active. Elapsed: $([math]::Round($Elapsed.TotalMinutes, 1)) mins"
              Start-Sleep -Seconds 60
          }
